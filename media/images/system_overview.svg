<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6472"/>
    </marker>
    <marker id="arwT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0655b"/>
    </marker>
  </defs>

  <rect width="1240" height="640" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1239" height="639" fill="none" stroke="#e3e6ea"/>

  <text x="34" y="40" font-size="21" font-weight="700" fill="#1b1f24">Indoor Autonomous Drone &#8212; System Architecture</text>
  <text x="34" y="62" font-size="12.5" fill="#6a7280">GPS-denied F450 quadrotor &#183; staged MATLAB software-in-the-loop &#183; truth used only for scoring, never for flight</text>

  <!-- ============ SENSORS ============ -->
  <g>
    <rect x="34" y="96" width="176" height="330" rx="10" fill="#f4f7fb" stroke="#c8d4e2"/>
    <text x="122" y="120" font-size="13" font-weight="700" fill="#33506e" text-anchor="middle">SENSORS (simulated)</text>
    <g font-size="11.5" fill="#2b3440">
      <rect x="50" y="134" width="144" height="42" rx="6" fill="#ffffff" stroke="#c8d4e2"/>
      <text x="122" y="151" text-anchor="middle" font-weight="600">IMU &#215;2</text>
      <text x="122" y="167" text-anchor="middle" fill="#6a7280">200 Hz</text>
      <rect x="50" y="184" width="144" height="42" rx="6" fill="#ffffff" stroke="#c8d4e2"/>
      <text x="122" y="201" text-anchor="middle" font-weight="600">Visual odometry</text>
      <text x="122" y="217" text-anchor="middle" fill="#6a7280">D435i-class &#183; ~30 Hz</text>
      <rect x="50" y="234" width="144" height="42" rx="6" fill="#ffffff" stroke="#c8d4e2"/>
      <text x="122" y="251" text-anchor="middle" font-weight="600">2-D LiDAR</text>
      <text x="122" y="267" text-anchor="middle" fill="#6a7280">RPLidar &#183; ~5.5 Hz</text>
      <rect x="50" y="284" width="144" height="42" rx="6" fill="#ffffff" stroke="#c8d4e2"/>
      <text x="122" y="301" text-anchor="middle" font-weight="600">Down rangefinder</text>
      <text x="122" y="317" text-anchor="middle" fill="#6a7280">tilt / lever-arm aware</text>
      <rect x="50" y="334" width="144" height="42" rx="6" fill="#ffffff" stroke="#c8d4e2"/>
      <text x="122" y="351" text-anchor="middle" font-weight="600">Barometer</text>
      <text x="122" y="367" text-anchor="middle" fill="#6a7280">altitude + bias</text>
    </g>
    <text x="122" y="404" font-size="10.5" fill="#8a93a0" text-anchor="middle">S2.5 injects faults here</text>
    <text x="122" y="418" font-size="10.5" fill="#8a93a0" text-anchor="middle">(dropout / outlier / stale)</text>
  </g>

  <!-- ============ ESKF ============ -->
  <g>
    <rect x="250" y="112" width="196" height="150" rx="10" fill="#eef4ee" stroke="#b7ceb7"/>
    <text x="348" y="134" font-size="13" font-weight="700" fill="#3a5a3a" text-anchor="middle">MULTI-LANE ESKF</text>
    <text x="348" y="151" font-size="10.5" fill="#5f7a5f" text-anchor="middle">S2 &#183; S2.1</text>
    <g font-size="11" fill="#2b3440">
      <text x="266" y="174">&#8226; quaternion error-state KF</text>
      <text x="266" y="192">&#8226; 4 parallel estimator lanes</text>
      <text x="266" y="210">&#8226; NIS gating + IMU fault ID</text>
      <text x="266" y="228">&#8226; bounded lane switching</text>
      <text x="266" y="246">&#8226; XY-loss braking / degraded nav</text>
    </g>
  </g>

  <!-- ============ MAP ============ -->
  <g>
    <rect x="250" y="300" width="196" height="150" rx="10" fill="#eef4ee" stroke="#b7ceb7"/>
    <text x="348" y="322" font-size="13" font-weight="700" fill="#3a5a3a" text-anchor="middle">OCCUPANCY MAP</text>
    <text x="348" y="339" font-size="10.5" fill="#5f7a5f" text-anchor="middle">S2.3 &#183; S2.4</text>
    <g font-size="11" fill="#2b3440">
      <text x="266" y="362">&#8226; log-odds free / occ / unknown</text>
      <text x="266" y="380">&#8226; ray-based free-space update</text>
      <text x="266" y="398">&#8226; route-relevant change detect</text>
      <text x="266" y="416">&#8226; read-only frontier / entropy</text>
      <text x="266" y="434">&#8226; fail-closed planner grid</text>
    </g>
  </g>

  <!-- ============ MISSION MANAGER ============ -->
  <g>
    <rect x="486" y="150" width="220" height="264" rx="10" fill="#f1eef8" stroke="#c5bce0"/>
    <text x="596" y="172" font-size="13" font-weight="700" fill="#4a3d73" text-anchor="middle">MISSION-LIFECYCLE MANAGER</text>
    <text x="596" y="189" font-size="10.5" fill="#6a5f92" text-anchor="middle">S2.2 &#183; S2.4 &#183; S2.4-F &#183; S2.4-G</text>
    <g font-size="11" fill="#2b3440">
      <text x="502" y="214">&#8226; goal &#8594; RTL &#8594; landing state</text>
      <text x="502" y="234">&#8226; D* Lite / A* replanning on</text>
      <text x="516" y="250">the inflated known-free grid</text>
      <text x="502" y="270">&#8226; recovery hierarchy:</text>
      <text x="516" y="286">trajectory &#8594; grid route &#8594;</text>
      <text x="516" y="302">relocation &#8594; failsafe / RTL</text>
      <text x="502" y="322">&#8226; target-directed exploration</text>
      <text x="516" y="338">requests (tier 1&gt;2&gt;3)</text>
      <text x="502" y="358">&#8226; execution-time re-validation</text>
      <text x="516" y="374">of the active authority (S2.4-F)</text>
      <text x="502" y="394">&#8226; progress watchdog</text>
    </g>
  </g>

  <!-- ============ TRAJECTORY ============ -->
  <g>
    <rect x="746" y="150" width="180" height="120" rx="10" fill="#fbf3ea" stroke="#e6cdaa"/>
    <text x="836" y="172" font-size="13" font-weight="700" fill="#7a5a2e" text-anchor="middle">TRAJECTORY GEN</text>
    <text x="836" y="189" font-size="10.5" fill="#8a6c40" text-anchor="middle">S2.2</text>
    <g font-size="11" fill="#2b3440">
      <text x="762" y="212">&#8226; jerk-limited minimum-snap</text>
      <text x="762" y="230">&#8226; dense grid collision check</text>
      <text x="762" y="248">&#8226; verified low-speed grid</text>
      <text x="776" y="264">fallback (stop-at-corner)</text>
    </g>
  </g>

  <!-- ============ CONTROL ============ -->
  <g>
    <rect x="746" y="296" width="180" height="118" rx="10" fill="#fbf3ea" stroke="#e6cdaa"/>
    <text x="836" y="318" font-size="13" font-weight="700" fill="#7a5a2e" text-anchor="middle">CASCADED CONTROL</text>
    <text x="836" y="335" font-size="10.5" fill="#8a6c40" text-anchor="middle">S1</text>
    <g font-size="11" fill="#2b3440">
      <text x="762" y="358">&#8226; outer position / velocity</text>
      <text x="762" y="376">&#8226; inner attitude / rate</text>
      <text x="762" y="394">&#8226; tilt / thrust / moment</text>
      <text x="776" y="410">limits, altitude hold</text>
    </g>
  </g>

  <!-- ============ PLANT ============ -->
  <g>
    <rect x="966" y="200" width="164" height="164" rx="10" fill="#eef1f4" stroke="#c3ccd6"/>
    <text x="1048" y="224" font-size="13" font-weight="700" fill="#3b4653" text-anchor="middle">F450 PLANT</text>
    <g font-size="11" fill="#2b3440">
      <text x="982" y="250">&#8226; 6-DoF rigid body</text>
      <text x="982" y="270">&#8226; 4&#215;&#160;920 KV rotor model</text>
      <text x="982" y="290">&#8226; 10 in props, T/W &#8776; 2.4</text>
      <text x="982" y="310">&#8226; 0.352 m collision radius</text>
      <text x="982" y="330">&#8226; 0.502 m geofence inset</text>
    </g>
  </g>

  <!-- ============ ARROWS ============ -->
  <g stroke="#5b6472" stroke-width="1.7" fill="none" marker-end="url(#arw)">
    <path d="M210 200 H248"/>
    <path d="M210 300 C 226 300 226 372 248 372"/>
    <path d="M348 262 V 298"/>
    <path d="M446 200 C 466 200 466 236 484 236"/>
    <path d="M446 372 C 466 372 466 336 484 336"/>
    <path d="M706 210 H 744"/>
    <path d="M706 348 H 744"/>
    <path d="M836 270 V 294"/>
    <path d="M926 355 C 946 355 946 300 964 300"/>
  </g>

  <!-- truth feedback (sim only) -->
  <path d="M1048 366 C 1048 470 122 470 122 428" stroke="#c0655b" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arwT)"/>
  <text x="585" y="486" font-size="11" fill="#c0655b" text-anchor="middle">ground truth &#8594; sensor generation + independent validation only (truth isolation audited every stage)</text>

  <!-- ============ VALIDATION STRIP ============ -->
  <g>
    <rect x="34" y="512" width="1172" height="96" rx="10" fill="#f7f8fa" stroke="#dfe3e8"/>
    <text x="50" y="534" font-size="12.5" font-weight="700" fill="#33404f">STAGED VALIDATION &#8212; each stage is frozen only after it passes</text>
    <g font-size="11.5" fill="#2b3440">
      <text x="50" y="558">1. build on the byte-frozen parent</text>
      <text x="330" y="558">2. independent Python mechanism / contract checks</text>
      <text x="700" y="558">3. MATLAB deterministic scenario matrix</text>
      <text x="990" y="558">4. multi-seed sweep</text>
    </g>
    <g font-size="11" fill="#55606e">
      <text x="50" y="582">S1 dynamics+PID &#10003;</text>
      <text x="200" y="582">S2 SLAM+ESKF &#10003;</text>
      <text x="352" y="582">S2.1 fault-tolerant lanes &#10003;</text>
      <text x="560" y="582">S2.2 replanning 12/12 &#10003;</text>
      <text x="770" y="582">S2.3 online mapping &#10003;</text>
      <text x="960" y="582">S2.4 exploration 10/10 &#10003;</text>
    </g>
    <g font-size="11" fill="#55606e">
      <text x="50" y="600">S2.4-F execution-time safety &#10003;</text>
      <text x="330" y="600">S2.4-G full closed-loop 75/75 &#10003;</text>
      <text x="640" y="600" fill="#b06a1f" font-weight="600">S2.5 estimation + perception robustness &#8212; in progress</text>
      <text x="980" y="600" fill="#8a93a0">S3 &#183; S4 planned</text>
    </g>
  </g>
</svg>
